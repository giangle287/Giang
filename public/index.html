<style>

[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
@media (max-width:880px){.app{grid-template-columns:1fr}}
.side{background:var(--paper);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;overflow:auto}
.brand{font-weight:800;padding:2px 10px 14px}.brand small{display:block;font-weight:500;color:var(--muted);font-size:.76rem}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500;position:relative}
.nav-btn svg{width:19px;height:19px;flex:none}
.nav-btn[aria-current="page"]{background:var(--soft);color:var(--ink);font-weight:700}
.nav-btn .badge{margin-left:auto}
.role-wrap{margin-top:auto;padding:10px 4px;border-top:1px solid var(--line)}
.role-wrap label{font-size:.76rem;color:var(--muted);display:block;margin-bottom:4px}
@media (max-width:880px){.side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:30;justify-content:space-around;overflow:visible}
 .brand,.role-wrap{display:none}.nav-btn{flex-direction:column;gap:2px;font-size:.64rem;padding:6px 2px;width:auto;flex:1 1 0;min-width:0;align-items:center;text-align:center;white-space:nowrap}
 .nav-btn .badge{position:absolute;top:0;right:14%;margin:0}}
main{padding:18px 22px 120px;min-width:0}
@media (max-width:880px){main{padding:12px 12px 110px}}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.top h1{font-size:1.35rem;margin:0;font-weight:800;flex:1;min-width:160px}
.mrole{display:none;width:100%}@media (max-width:880px){.mrole{display:block}}
.sub{color:var(--muted);font-size:.86rem;margin:0 0 12px}
.note{font-size:.8rem;color:var(--muted);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:8px;padding:7px 11px;margin-bottom:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .v{font-size:1.35rem;font-weight:800;line-height:1.25}.kpi .l{font-size:.78rem;color:var(--muted)}.kpi .d{font-size:.78rem;margin-top:2px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warnc{color:var(--warn)}.muted{color:var(--muted)}.small{font-size:.83rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
select,input,textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
textarea{width:100%;min-height:64px}
.btn{border:1px solid var(--line);background:var(--paper);padding:7px 11px;border-radius:8px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.sm{padding:4px 9px;font-size:.84rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap;margin-bottom:12px;background:var(--paper)}
.tabs button{border:0;background:none;padding:8px 13px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:16px;padding:5px 11px;font-size:.84rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.st{font-weight:700;margin:16px 0 8px;font-size:1rem}
.tbl{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:.87rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--soft);font-weight:600;white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}td.c,th.c{text-align:center}
tr:last-child td{border-bottom:none}
tr.click{cursor:pointer}tr.click:hover td{background:var(--soft)}
.pill{display:inline-block;padding:1px 8px;border-radius:12px;font-size:.75rem;font-weight:600;background:var(--soft);white-space:nowrap}
.pill.g{background:var(--ok-bg);color:var(--pos)}.pill.r{background:var(--neg-bg);color:var(--neg)}.pill.y{background:var(--warn-bg);color:var(--warn)}.pill.b{background:var(--soft);color:var(--accent)}
.tts{display:inline-block;padding:0 6px;border-radius:5px;font-size:.68rem;font-weight:800;background:#7467AE;color:#fff;margin-left:5px;vertical-align:1px}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.prog{display:grid;grid-template-columns:150px minmax(0,1fr) 110px;gap:10px;align-items:center;margin:8px 0;font-size:.88rem}
@media (max-width:520px){.prog{grid-template-columns:1fr 70px}.prog .bar{grid-column:1/-1;order:3}}
.alert{border:1px solid var(--line);border-left:4px solid var(--c,var(--line));background:var(--paper);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.field{margin-bottom:9px}.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:3px}.field input,.field select{width:100%}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.bcard{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px}
.bcard h3{margin:0 0 2px;font-size:.88rem}
.floors{display:flex;flex-direction:column-reverse;gap:3px;margin-top:6px}
.floor{border:0;border-radius:4px;padding:4px 7px;color:#fff;font-size:.72rem;font-weight:600;display:flex;justify-content:space-between}
.overlay{position:fixed;inset:0;background:rgba(10,15,22,.45);z-index:50;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(600px,100%);height:100%;overflow:auto;padding:16px 18px 40px}

.sh{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}.sh h2{margin:0;font-size:1.15rem;flex:1}

.bh{background:#fff;color:#111;border-radius:6px;overflow:hidden;border:1px solid #ddd;min-width:720px}

.bh td{border:1px solid #eee;text-align:center;vertical-align:middle;color:#111}
.bh td.addr{text-align:left;font-weight:700}.bh td.q{font-weight:800}.bh td.price{color:var(--az);font-weight:800}
.bh .ft{text-align:center;font-size:.82rem;padding:3px 8px;border-top:1px solid #eee;color:#333}
.bh .contact{background:var(--az);color:#fff;text-align:center;font-weight:800;font-size:1.1rem;padding:10px}

@media (max-width:880px){.chat{right:12px;bottom:calc(130px + env(safe-area-inset-bottom,0px));height:calc(100% - 200px)}}
.chat-h{padding:12px 14px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.chat-b{flex:1;overflow:auto;padding:12px}
.chat-f{padding:10px;border-top:1px solid var(--line);background:var(--paper);display:flex;gap:8px}
.msg{margin-bottom:10px;font-size:.88rem}.msg.me{text-align:right}.msg.me span{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:6px 10px;border-radius:10px}
.post{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;font-size:.86rem}
.post h4{margin:0 0 4px;font-size:.9rem}.post pre{white-space:pre-wrap;font-family:inherit;margin:6px 0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

const sellers=()=>Object.values(S.staff).filter(p=>p.role==="sale"||p.role==="tp"||p.role==="mg");

/* ---------------- hoa hồng ---------------- */
function heSo(gia,uuDai,thang,chao,chot){const q=gia-(uuDai||0)/(thang||12);
  if(q>=chao)return{h:1.1,q};if(q>=chot)return{h:1,q};if(q>=chot*.95)return{h:.8,q,duyet:1};if(q>=chot*.9)return{h:.6,q,duyet:1};return{h:null,q}}
function commissions(){
  const out=[];const byCloser={};
  S.deals.filter(d=>inMonth(d.at)).sort((a,b)=>a.at-b.at).forEach(d=>{
    const p=S.staff[d.closer]; if(!p) return;
    if(d.type==="mg"){out.push({deal:d,person:d.mgConn,amt:d.gia*S.cfg.mg,rate:S.cfg.mg,h:1,note:"Giao dịch môi giới ngoài, 10% cố định",bac:null});return}
    if(d.src==="cty"){out.push({deal:d,person:d.closer,amt:0,rate:0,h:1,note:"Lead công ty: chỉ hưởng tiền dẫn khách",bac:null});return}
    byCloser[d.closer]=(byCloser[d.closer]||0)+1;
    const order=byCloser[d.closer];const lop=p.role==="tp"?3:p.lop;
    let rate,base,hs={h:1};
    if(d.type==="az"){rate=S.cfg.az[lop][Math.min(order,4)-1];base=d.gia;hs=heSo(d.gia,d.uuDai,d.thang,d.chao,d.chot)}
    else{const noAz=p.dm>=2&&!S.deals.some(x=>x.closer===d.closer&&x.type==="az"&&inMonth(x.at));
      rate=S.cfg.ext[lop][noAz?0:Math.min(order,3)-1];base=d.phi;}
    const total=base*rate*(hs.h||0);
    const note=(d.type==="az"?"Sàn AZ":"Sàn ngoài")+` · giao dịch thứ ${order} · ${Math.round(rate*100)}%`+(hs.h!==1?` · hệ số giá ${Math.round(hs.h*100)}%`:"")+(d.type==="ext"&&p.dm>=2&&!S.deals.some(x=>x.closer===d.closer&&x.type==="az"&&inMonth(x.at))?" · chỉ bậc 1 vì chưa chốt sàn AZ nào":"");
    if(d.finder&&d.finder!==d.closer&&S.staff[d.finder]){
      out.push({deal:d,person:d.closer,amt:total*S.cfg.chia.chot,rate,h:hs.h,note:note+` · nhận ${Math.round(S.cfg.chia.chot*100)}% vì được nhờ dẫn`,bac:order});
      out.push({deal:d,person:d.finder,amt:total*S.cfg.chia.tim,rate,h:hs.h,note:note+` · người giữ khách nhận ${Math.round(S.cfg.chia.tim*100)}%`,bac:null});
    } else out.push({deal:d,person:d.closer,amt:total,rate,h:hs.h,note,bac:order});
  });return out;
}
function dxCount(id){const p=S.staff[id];return (p.dxPast||0)+S.appts.filter(a=>a.by===id&&a.arrived&&a.guard&&inMonth(a.at)).length}
function income(id){const p=S.staff[id];if(p.role==="bgd")return null;
  const cm=commissions().filter(c=>c.person===id);
  const luong=p.role==="tp"?S.cfg.luong.tp:p.role==="mg"?S.cfg.luong.mg:S.cfg.luong[p.lop];
  const dan=dxCount(id)*(S.cfg.dan[p.role==="tp"?3:p.lop]||0);
  const chac=cm.filter(c=>c.deal.paid).reduce((s,c)=>s+c.amt,0),cho=cm.filter(c=>!c.deal.paid).reduce((s,c)=>s+c.amt,0);
  let team=0,teamOk=true;
  if(p.role==="tp"){const all=commissions().filter(c=>c.person!==id).reduce((s,c)=>s+c.amt,0);teamOk=S.deals.some(d=>d.closer===id&&inMonth(d.at));team=teamOk?all*S.cfg.team:0}
  const nextOrder=(S.deals.filter(d=>d.closer===id&&inMonth(d.at)&&d.type!=="mg"&&d.src!=="cty").length)+1;
  const lop=p.role==="tp"?3:p.lop;const next=S.cfg.az[lop]?S.cfg.az[lop][Math.min(nextOrder,4)-1]:0;
  return {luong,dan,chac,cho,team,teamOk,total:luong+dan+chac+cho+team,cm,next,nextOrder};
}
function kpi(id){const p=S.staff[id];if(p.role==="tp"){const own=S.deals.filter(d=>d.closer===id&&inMonth(d.at)).length;return [{k:"gd",t:"Giao dịch tự chốt",v:own,g:1,note:"điều kiện hưởng hoa hồng đội nhóm"}]}const k=p.tts?S.cfg.kpi.tts:S.cfg.kpi[p.role==="tp"?3:p.lop]||S.cfg.kpi[2];
  const ds=S.deals.filter(d=>(d.closer===id||d.mgConn===id)&&inMonth(d.at));
  const az=ds.filter(d=>d.type==="az"||d.type==="mg").length;
  const azReq=p.dm>=2?k.az:0;
  return [{k:"gd",t:"Giao dịch",v:ds.length,g:k.gd},{k:"az",t:"Trong đó sàn AZ",v:az,g:azReq,note:p.dm<2?"miễn vì danh mục dưới 2 sàn":""},{k:"tin",t:"Tin duy trì hiển thị",v:p.tin||0,g:k.tin},{k:"dx",t:"Khách tự dẫn xem",v:dxCount(id),g:k.dx},{k:"mg",t:"Khách môi giới xem",v:p.mgXem||0,g:k.mg}]}
function flagged(id){const p=S.staff[id];return p.prevAct!==undefined&&p.prevAct<=.8}
function rankList(){return sellers().filter(p=>p.role==="sale").map(p=>({id:p.id,gd:S.deals.filter(d=>d.closer===p.id&&inMonth(d.at)).length,inc:income(p.id).total})).sort((a,b)=>b.gd-a.gd||b.inc-a.inc)}

function openSheet(h){$("#layer").innerHTML=`<div class="overlay" role="dialog" aria-modal="true"><div class="sheet">${h}</div></div>`;const o=$("#layer .overlay");o.onclick=e=>{if(e.target===o)close_()};document.querySelectorAll("[data-close]").forEach(b=>b.onclick=close_);bindCommon($("#layer"))}
function close_(){$("#layer").innerHTML=""}
function form(title,body,ok,back){openSheet(`<div class="sh"><h2>${title}</h2><button class="btn sm" data-close>Đóng</button></div>${body}<div id="f-err"></div><div class="row" style="margin-top:10px"><button class="btn primary" id="f-ok">Lưu</button>${back?'<button class="btn" id="f-back">Quay lại</button>':""}</div>`);
  $("#f-ok").onclick=()=>{const e=ok();if(typeof e==="string"){$("#f-err").innerHTML=`<div class="note" style="margin-top:8px">${esc(e)}</div>`;return}save();render();if(back)back();else close_()};if(back)$("#f-back").onclick=back}

  const mgs=$("#mg-save");if(mgs)mgs.onclick=()=>{S.mgDay={spam:+$("#mg-spam").value||0,moi:+$("#mg-moi").value||0,rieng:+$("#mg-rieng").value||0,hoi:+$("#mg-hoi").value||0,note:$("#mg-note").value};save();toast("Đã lưu báo cáo ngày")};
  const la=$("#lk-add");if(la)la.onclick=()=>{const v=$("#lk").value.trim();if(!v){toast("Dán đường dẫn");return}const all=Object.values(S.links).flat();if(all.includes(v)){toast("Đường dẫn đã được khai báo");return}(S.links[S.me]=S.links[S.me]||[]).push(v);me().tin=(me().tin||0)+1;save();render();toast("Đã thêm, phần mềm sẽ kiểm tra tin còn hiển thị")};
  const ms=$("#m-save");if(ms){$("#m-p").oninput=e=>{let p=e.target.value.replace(/\D/g,"");const d=S.customers.find(c=>c.phone===p);$("#m-dup").innerHTML=d?`<div class="note">Trùng khách ${esc(d.name)} của ${esc(pn(d.closer))}, không ghi nhận cho môi giới.</div>`:""};
    ms.onclick=()=>{let p=$("#m-p").value.replace(/\D/g,"");if(!/^0\d{9}$/.test(p)){toast("Số điện thoại chưa đúng");return}if(S.customers.some(c=>c.phone===p)){toast("Khách đã có trong hệ thống");return}
      let bid=$("#m-b").value;
      if(!bid){const bn=$("#m-bn").value.trim(),bp=$("#m-bp").value.replace(/\D/g,"");if(!bn||!/^0\d{9}$/.test(bp)){toast("Nhập tên và số điện thoại môi giới mới");return}
        if(S.brokers.some(x=>x.phone.replace(/\D/g,"")===bp)){toast("Môi giới đã có trong danh bạ");return}
        bid="m"+Date.now();S.brokers.push({id:bid,name:bn,phone:bp,cty:"Tự do",khu:"",open:0,since:Date.now()});S.mgHist[bid]={dk:0,dx:0,hd:0,hh:0}}
      S.customers.unshift({id:"k"+Date.now(),name:$("#m-n").value||"Khách môi giới",phone:p,company:"Chưa có",need:U($("#m-u").value).area,budget:U($("#m-u").value).chao,area:"",src:"mg",broker:bid,finder:bid,closer:S.me,step:"Mới",heat:"am",created:TODAY.getTime(),last:TODAY.getTime(),lost:null,intro:[$("#m-u").value],logs:[{at:TODAY.getTime(),by:S.me,how:"Hệ thống",text:"Đăng ký khách môi giới "+pn(bid)+" lúc "+tstr(Date.now())+". "+($("#m-mt").value||"")}],dxAt:null,helper:null});
      S.mgHist[bid].dk++;save();render();toast("Đã đăng ký, ghi nhận đầu mối cho "+me().name)}}
  const qa=$("#q-add");if(qa)qa.onclick=()=>{let p=$("#q-p").value.replace(/\D/g,"");if(!/^0\d{9}$/.test(p)){toast("Số điện thoại chưa đúng");return}const d=S.customers.find(c=>c.phone===p);if(d){toast("Trùng khách của "+pn(d.closer));return}const khu=[...document.querySelectorAll(".q-khu:checked")].map(x=>x.value);S.queue.push({id:"q"+Date.now(),name:$("#q-n").value||"Khách mới",phone:p,khu,dt:+$("#q-a").value||0,tc:+$("#q-b").value||0,need:$("#q-need").value,kenh:$("#q-k").value,at:Date.now()});save();render()};
  const give=(q,to)=>{S.customers.unshift({id:"k"+Date.now()+Math.random(),name:q.name,phone:q.phone,company:"Chưa có",need:0,budget:0,area:"",src:"cty",finder:"cty",closer:to,step:"Mới",heat:"am",created:TODAY.getTime(),last:TODAY.getTime(),lost:null,intro:[],logs:[{at:TODAY.getTime(),by:S.me,how:"Chia lead",text:q.need+" · "+q.kenh}],dxAt:null,helper:null});S.queue=S.queue.filter(x=>x.id!==q.id)};
  m.querySelectorAll("[data-qgo]").forEach(b=>b.onclick=()=>{const q=S.queue.find(x=>x.id===b.dataset.qgo),to=m.querySelector(`[data-qto="${q.id}"]`).value;give(q,to);save();render();toast("Đã chia cho "+pn(to))});
  const qau=$("#q-auto");if(qau)qau.onchange=e=>{S.cfg.autoChia=e.target.checked;save()};
  const qr=$("#q-autorun");if(qr)qr.onclick=()=>{const order=[...sellers().filter(p=>p.role==="tp"),...[3,2,1].flatMap(l=>sellers().filter(p=>p.role==="sale"&&p.lop===l))].filter(p=>!flagged(p.id));let i=S.rr||0;const names=[];
    S.queue.slice().forEach(q=>{const p=order[i%order.length];give(q,p.id);names.push(p.name);i++});S.rr=i;save();render();toast("Đã chia: "+names.join(", "))};
  const hp=$("#hs-pdf");if(hp)hp.onclick=()=>{toast("Mở cửa sổ in để lưu PDF");setTimeout(()=>window.print(),700)};
  const cs=$("#c-save");if(cs)cs.onclick=()=>{const c=S.cfg;const t=+$("#c-tim").value;c.chia={tim:t/100,chot:(100-t)/100};c.team=+$("#c-team").value/100;c.dan={1:+$("#c-d1").value,2:+$("#c-d2").value,3:+$("#c-d2").value};c.baove=+$("#c-bv").value;c.mg=+$("#c-mg").value/100;c.hhMkt=(+$("#c-mkt").value||0)/100;c.hhDan=(+$("#c-hd").value||0)/100;c.setupThap=+$("#c-s1").value||7;c.setupCao=+$("#c-s2").value||10;save();render();toast("Đã lưu, thu nhập tính lại ngay")};
  const cr=$("#c-reset");if(cr)cr.onclick=()=>{if(confirm("Xóa mọi thao tác và khôi phục dữ liệu mẫu?")){S=seed();save();VIEW=null;render()}};
}

/* ---------------- trợ lý viết tin ---------------- */
let CHAT=[],CHATOPEN=false,SAMPLE=null;
(async()=>{try{if(window.claude&&window.claude.use){SAMPLE=await window.claude.use("sample")}}catch(e){SAMPLE=null}})();
$("#fab").onclick=()=>{CHATOPEN=!CHATOPEN;renderChat()};
function renderChat(){if(!CHATOPEN){$("#chatbox").innerHTML="";return}
  $("#chatbox").innerHTML=`<div class="chat" role="dialog" aria-label="Trợ lý viết tin"><div class="chat-h"><b style="flex:1">Trợ lý viết tin</b><button class="btn sm" id="ch-x">Đóng</button></div>
  <div class="chat-b" id="ch-b"><div class="msg muted small">Gõ mã sàn để nhận 1 tin chính và 5 tin vệ tinh. Ví dụ: <b>T4-89TL</b>, <b>MBKD-85ND</b>, <b>T4-162TP</b>. Có thể thêm yêu cầu sau mã sàn.</div>
  ${CHAT.map(m=>m.me?`<div class="msg me"><span>${esc(m.text)}</span></div>`:`<div class="msg">${m.html}</div>`).join("")}</div>
  <div class="chat-f"><input id="ch-i" placeholder="Nhập mã sàn…" style="flex:1" autocomplete="off"><button class="btn primary" id="ch-s">Gửi</button></div></div>`;
  $("#ch-x").onclick=()=>{CHATOPEN=false;renderChat()};$("#ch-s").onclick=sendChat;$("#ch-i").onkeydown=e=>{if(e.key==="Enter")sendChat()};
  const b=$("#ch-b");b.scrollTop=b.scrollHeight;$("#ch-i").focus();
  b.querySelectorAll("[data-copy]").forEach(x=>x.onclick=()=>{const t=x.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Đã sao chép")).catch(()=>toast("Không sao chép được, hãy bôi đen và sao chép"))});
}
function unitInfo(u){const p=me().role==="bgd"?S.staff.bgd:me();return {ma:u.code,toa:BN[u.b]||u.b,quan:QUAN[u.b]||"",tang:u.floor,dien_tich:u.area+" m2",gia:u.usd?u.usdM2+" USD/m2/tháng":tr(u.chao)+"/tháng",phi_dich_vu:u.usd?u.feeUsd+" USD/m2":tr(u.fee)+"/tháng",ban_giao:u.status==="bao"?dstr(u.due):"Vào luôn",dien:"4.500đ/kWh",gui_xe:"150.000đ/xe/tháng",thanh_toan:"3 cọc 2 hoặc 6 cọc 1",vat:"Giá chưa gồm VAT",lien_he:p.phone+" ("+(p.role==="bgd"?"Mr.Tùng":p.name)+")"}}
function localPosts(u,extra){const i=unitInfo(u);const type=u.area>=150?"Sàn văn phòng":u.area<=40?"Văn phòng nhỏ":"Văn phòng";
  const angles=[["",""],["Giá tốt","phù hợp doanh nghiệp đang tìm chi phí hợp lý"],["Vào ở ngay","bàn giao nhanh, không phải chờ"],["Khu trung tâm","thuận tiện đi lại, gần tuyến phố chính"],["Trọn gói","phí dịch vụ đã gồm bảo vệ, vệ sinh, thang máy"],["Chủ trực tiếp","làm việc trực tiếp với đơn vị vận hành"]];
  return angles.map(([h,why],k)=>{let title=`Cho thuê ${type.toLowerCase()} ${i.toa.split(" - ")[0]}, ${i.quan}, ${i.dien_tich}${h?", "+h.toLowerCase():""}, ${i.gia}`;if(title.length>100)title=title.slice(0,99);
    const body=`🏢 ${type} tầng ${i.tang}, ${i.toa}, ${i.quan}\n📐 Diện tích: ${i.dien_tich}\n💰 Giá thuê: ${i.gia}\n🧾 Phí dịch vụ: ${i.phi_dich_vu} (bảo vệ, vệ sinh, thang máy, điện chiếu sáng chung, rác)\n⚡ Điện: ${i.dien} · 🛵 Gửi xe: ${i.gui_xe}\n📅 Bàn giao: ${i.ban_giao}\n💳 Thanh toán: ${i.thanh_toan} · ${i.vat}${why?"\n✅ "+why.charAt(0).toUpperCase()+why.slice(1):""}${extra?"\n✨ "+extra:""}\n📞 Liên hệ xem sàn: ${i.lien_he}`;
    return {title,body}})}
function postsHtml(u,posts,ai){return `<div class="small muted" style="margin-bottom:6px">${esc(u.code)} · ${ai?"AI viết từ dữ liệu kho sàn":"bản soạn theo mẫu (mở trong Claude để AI viết)"}</div>`+posts.map((p,k)=>`<div class="post"><h4>${k===0?"Tin chính":"Tin vệ tinh "+k}</h4><div><b>${esc(p.title)}</b> <span class="small muted">(${[...p.title].length} ký tự)</span> <button class="btn sm" data-copy="${esc(p.title)}">Chép tiêu đề</button></div><pre>${esc(p.body)}</pre><button class="btn sm" data-copy="${esc(p.body)}">Chép nội dung</button></div>`).join("")}
async function sendChat(){const v=$("#ch-i").value.trim();if(!v)return;CHAT.push({me:1,text:v});
  const code=v.split(/\s+/)[0].toUpperCase();const extra=v.slice(code.length).trim();const u=S.units.find(x=>x.code.toUpperCase()===code);
  if(!u){CHAT.push({html:`Không tìm thấy mã sàn <b>${esc(code)}</b>. Mã đang trống: ${S.units.filter(x=>x.status==="trong"||x.status==="bao").map(x=>x.code).join(", ")}.`});renderChat();return}
  if(u.status==="thue"||u.status==="giu"){CHAT.push({html:`<div class="small muted">Lưu ý: sàn ${esc(u.code)} đang ở trạng thái ${ST[u.status].t}.</div>`})}
  if(!SAMPLE){CHAT.push({html:postsHtml(u,localPosts(u,extra),false)});renderChat();return}
  CHAT.push({html:'<span class="muted">Đang viết tin…</span>'});renderChat();
  try{const info=unitInfo(u);
    const prompt=`Bạn là trợ lý viết tin đăng cho thuê văn phòng của AZ OFFICE tại Hà Nội. Viết 1 tin chính và 5 tin vệ tinh cho sàn dưới đây.
Quy định: tiêu đề tối đa 100 ký tự, gồm loại hình, vị trí, diện tích, cấu trúc hoặc tầng, điểm nổi bật và giá. Nội dung ngắn gọn, mỗi dòng bắt đầu bằng biểu tượng cảm xúc, nêu đủ thông số và giá, kết thúc bằng số liên hệ. 5 tin vệ tinh phải khác nhau về tiêu đề, góc nhìn và câu chữ để không bị trùng lặp. Chỉ dùng dữ liệu được cung cấp, không bịa thêm tiện ích, không nêu hoa hồng hay giá chốt. Viết tiếng Việt.
${extra?"Yêu cầu thêm của nhân viên: "+extra+"\n":""}Dữ liệu sàn (JSON): ${JSON.stringify(info)}
Chỉ trả về JSON dạng {"posts":[{"title":"...","body":"..."}, ... 6 phần tử, phần tử đầu là tin chính]}.`;
    const r=await SAMPLE.json(prompt,{modelTier:"default"});const posts=(r&&r.posts||[]).slice(0,6).map(p=>({title:String(p.title||"").slice(0,100),body:String(p.body||"")}));
    CHAT.pop();CHAT.push({html:posts.length?postsHtml(u,posts,true):postsHtml(u,localPosts(u,extra),false)});
  }catch(e){CHAT.pop();CHAT.push({html:(e&&e.code==="not_granted"?'<div class="small muted">Chưa được cấp quyền dùng AI, hiển thị bản soạn theo mẫu.</div>':"")+postsHtml(u,localPosts(u,extra),false)})}
  renderChat();
}
loadState().then(render);
</script>
